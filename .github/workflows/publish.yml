name: Update and deploy PakTV Ghar
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: paktv-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check privacy implementation
        run: |
          node --check cookie-consent.js
          node tests/ad-consent.test.js
          python3 -m py_compile refresh.py show_metadata.py youtube_index.py
          python3 -m unittest discover -s tests -p 'test_youtube_index.py' -v
          python3 -c "from pathlib import Path; s=Path('index.html').read_text(); assert 'cookie-consent.js' in s and 'privacy.html' in s and '<script src=\"https://pl31793699' not in s"
      - name: Refresh TV listings
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 refresh.py
      - name: Save latest guide to repository
        run: |
          git config user.name "PakTV Schedule Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Pakistani TV schedules [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
